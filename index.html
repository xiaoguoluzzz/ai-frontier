<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Frontier — 全球 AI 大模型资讯平台</title>
<meta name="description" content="AI Frontier 汇聚全球 AI 大模型资讯：最新 AI 新闻、主流模型数据库、能力排行榜与数学科研究突破。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* ============ 主题变量 ============ */
:root{
  --blue-700:#1d4ed8; --blue-800:#1e40af; --blue-900:#1e3a5f;
  --accent:#2563eb; --accent-dark:#1d4ed8;
  --ink:#0f172a; --ink-soft:#334155; --muted:#64748b; --faint:#94a3b8;
  --bg:#f8fafc; --card:#ffffff; --line:#e2e8f0; --line-soft:#eef2f7;
  --blue-bg:#eff6ff; --green-bg:#ecfdf5; --purple-bg:#f5f3ff; --orange-bg:#fff7ed;
  --green:#059669; --purple:#7c3aed; --orange:#ea580c;
  --radius:12px; --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 10px 30px rgba(15,23,42,.10),0 4px 8px rgba(15,23,42,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img,svg{display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

/* ============ 布局 ============ */
.container{max-width:1200px;margin:0 auto;padding:0 20px}
.icon{width:20px;height:20px;flex-shrink:0}

/* ============ 顶部导航 ============ */
.header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--blue-800));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
.brand-name{font-size:20px;font-weight:800;letter-spacing:-.01em}
.nav{display:flex;align-items:center;gap:4px}
.nav a{padding:8px 14px;border-radius:8px;font-size:15px;font-weight:500;color:var(--ink-soft);transition:.15s}
.nav a:hover{color:var(--accent);background:var(--blue-bg)}
.nav a.active{color:var(--accent);background:var(--blue-bg);font-weight:600}
.nav-search{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;background:var(--bg);color:var(--muted);font-size:14px;transition:.15s}
.nav-search:hover{background:var(--line-soft);color:var(--ink)}
.menu-btn{display:none;padding:8px;color:var(--ink-soft)}
.mobile-menu{display:none;border-top:1px solid var(--line);padding:8px 0 12px;background:#fff}
.mobile-menu a{display:block;padding:12px 16px;border-radius:8px;font-size:16px;color:var(--ink-soft)}
.mobile-menu a:hover{background:var(--blue-bg);color:var(--accent)}
.mobile-menu.open{display:block}

/* ============ Hero ============ */
.hero{background:linear-gradient(135deg,var(--blue-bg) 0%,#ffffff 55%,var(--blue-bg) 100%);border-bottom:1px solid var(--line)}
.hero-inner{text-align:center;padding:72px 20px;max-width:820px;margin:0 auto}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;background:#dbeafe;color:var(--blue-800);font-size:14px;font-weight:600;margin-bottom:20px}
.hero-title{font-size:56px;font-weight:900;letter-spacing:-.02em;background:linear-gradient(120deg,var(--blue-900),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:16px}
.hero-sub{font-size:19px;color:var(--ink-soft);max-width:640px;margin:0 auto 32px}
.hero-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* ============ 按钮 ============ */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 26px;border-radius:10px;font-size:15px;font-weight:600;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark)}
.btn-outline{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}

/* ============ 统计条 ============ */
.stats{background:#fff;border-bottom:1px solid var(--line)}
.stats-inner{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:36px 20px;text-align:center}
.stat-num{font-size:34px;font-weight:800;color:var(--accent)}
.stat-label{font-size:14px;color:var(--muted)}

/* ============ Section ============ */
.section{padding:56px 0}
.section.alt{background:#fff}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap}
.section-title{font-size:30px;font-weight:800;letter-spacing:-.01em}
.section-title .t{color:var(--accent)}
.section-desc{color:var(--muted);margin-top:6px;font-size:15px}
.section-link{color:var(--accent);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.section-link:hover{color:var(--accent-dark)}

/* ============ 卡片网格 ============ */
.grid{display:grid;gap:20px}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}

/* ============ 新闻卡片 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;transition:.2s;cursor:pointer;display:flex;flex-direction:column}
.card:hover{border-color:#bfdbfe;box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.card-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-title{font-size:17px;font-weight:700;line-height:1.35;margin-bottom:10px;transition:.15s}
.card:hover .card-title{color:var(--accent)}
.card-summary{font-size:14px;color:var(--muted);flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--faint)}
.card-foot .go{color:var(--accent);font-weight:600;font-size:14px}

/* ============ 标签 ============ */
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600}
.tag-blue{background:#dbeafe;color:var(--blue-800)}
.tag-green{background:#d1fae5;color:#065f46}
.tag-purple{background:#ede9fe;color:#5b21b6}
.tag-orange{background:#ffedd5;color:#9a3412}
.tag-gray{background:#f1f5f9;color:var(--muted)}
.chip{display:inline-flex;align-items:center;padding:4px 12px;border-radius:6px;font-size:13px;font-weight:500;background:var(--blue-bg);color:var(--accent)}

/* ============ 模型卡片 ============ */
.model-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:10px}
.model-name{font-size:19px;font-weight:800;margin-bottom:3px}
.model-company{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.model-open{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600}
.model-open.yes{background:var(--green-bg);color:var(--green)}
.model-open.no{background:#f1f5f9;color:var(--muted)}
.model-desc{font-size:14px;color:var(--muted);margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kv{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px dashed var(--line-soft)}
.kv .k{color:var(--faint)} .kv .v{color:var(--ink-soft);font-weight:600}

/* ============ 排行榜 ============ */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:11px 22px;border-radius:10px;font-size:15px;font-weight:600;background:#fff;border:1px solid var(--line);color:var(--ink-soft);transition:.15s}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;padding:14px 20px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--bg);border-bottom:1px solid var(--line)}
tbody td{padding:14px 20px;border-bottom:1px solid var(--line-soft);font-size:15px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--blue-bg)}
.rank{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-size:14px;font-weight:800}
.rank-1{background:#fbbf24;color:#fff}
.rank-2{background:#94a3b8;color:#fff}
.rank-3{background:#fb923c;color:#fff}
.rank-n{background:#e2e8f0;color:var(--ink-soft)}
.score-cell{display:flex;align-items:center;gap:14px;justify-content:flex-end}
.score-num{font-size:17px;font-weight:800;color:var(--accent);min-width:44px;text-align:right}
.score-bar{width:140px;height:8px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.score-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#60a5fa)}
.note{background:var(--blue-bg);border:1px solid #bfdbfe;border-radius:10px;padding:12px 16px;font-size:14px;color:var(--blue-900);margin-bottom:20px}
.disclaimer{margin-top:20px;text-align:center;font-size:13px;color:var(--faint)}

/* ============ 研究卡片 ============ */
.research-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;transition:.2s}
.research-card:hover{border-color:#c4b5fd;box-shadow:var(--shadow-lg)}
.research-title{font-size:21px;font-weight:800;margin:12px 0 8px}
.research-desc{font-size:15px;color:var(--muted);margin-bottom:16px}
.highlights{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-bottom:18px}
.highlights li{display:flex;gap:8px;font-size:14px;color:var(--ink-soft)}
.highlights li::before{content:"•";color:var(--accent);font-weight:700}
.paper{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--bg);border-radius:8px;margin-top:10px}
.paper .pt{font-weight:600;font-size:14px;line-height:1.4}
.paper .pa{font-size:12px;color:var(--faint);margin-top:3px}
.paper a{color:var(--accent);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;margin-top:4px}
.paper a:hover{color:var(--accent-dark)}

/* ============ 筛选按钮 ============ */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.filter-btn{padding:9px 18px;border-radius:9px;font-size:14px;font-weight:500;background:#fff;border:1px solid var(--line);color:var(--ink-soft);transition:.15s}
.filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ============ 搜索 ============ */
.search-box{position:relative;max-width:640px;margin:0 auto 28px}
.search-box input{width:100%;padding:16px 20px 16px 52px;border-radius:12px;border:2px solid var(--line);font-size:17px;outline:none;transition:.15s;background:#fff}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.search-box .s-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search-box .s-clear{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--faint);padding:4px;display:none}
.search-box .s-clear.show{display:block}
.result-group{margin-top:28px}
.result-group h3{font-size:18px;font-weight:800;margin-bottom:14px;color:var(--ink)}
.result-item{display:block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:12px;transition:.15s;cursor:pointer}
.result-item:hover{border-color:#bfdbfe;box-shadow:var(--shadow)}
.result-item .rt{font-size:16px;font-weight:700;margin-bottom:6px}
.result-item:hover .rt{color:var(--accent)}
.result-item .rs{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.result-item .rm{font-size:12px;color:var(--faint);margin-top:8px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .icon{width:56px;height:56px;color:var(--line);margin:0 auto 16px}
.empty h3{font-size:18px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}

/* ============ 详情页 ============ */
.detail{max-width:820px;margin:0 auto;padding:40px 20px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;margin-bottom:20px;font-size:15px}
.back:hover{color:var(--accent-dark)}
.article{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:36px;box-shadow:var(--shadow)}
.article h1{font-size:34px;font-weight:900;letter-spacing:-.01em;line-height:1.25;margin:14px 0 18px}
.article .lead{font-size:18px;color:var(--ink-soft);line-height:1.7;margin-bottom:20px}
.article .src{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);margin-bottom:24px;font-size:14px;color:var(--muted)}
.article .src a{color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.article .body h2{font-size:22px;font-weight:800;margin:28px 0 12px}
.article .body p{font-size:16px;color:var(--ink-soft);line-height:1.8;margin-bottom:14px}
.article .body ul{list-style:none;margin-bottom:16px}
.article .body ul li{display:flex;gap:8px;font-size:16px;color:var(--ink-soft);line-height:1.7;padding:3px 0}
.article .body ul li::before{content:"•";color:var(--accent);font-weight:700}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.detail-head h1{font-size:34px;font-weight:900;margin-bottom:8px}
.detail-company{display:flex;align-items:center;gap:8px;font-size:17px;color:var(--muted)}

/* ============ 页脚 ============ */
.footer{background:#0f172a;color:#cbd5e1;margin-top:auto}
.footer-inner{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px;padding:48px 20px}
.footer h4{color:#fff;font-size:14px;font-weight:700;margin-bottom:16px}
.footer p{font-size:14px;line-height:1.7;color:#94a3b8}
.footer-links{list-style:none}
.footer-links li{margin-bottom:10px}
.footer-links a{font-size:14px;color:#94a3b8;transition:.15s}
.footer-links a:hover{color:#fff}
.footer-bottom{border-top:1px solid rgba(255,255,255,.08);padding:20px;text-align:center;font-size:13px;color:#64748b}

/* ============ 响应式 ============ */
@media(max-width:900px){
  .grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}
  .footer-inner{grid-template-columns:1fr;gap:28px}
  .hero-title{font-size:42px}
}
@media(max-width:640px){
  .nav{display:none}
  .nav-search{display:none}
  .menu-btn{display:block}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .stats-inner{grid-template-columns:repeat(2,1fr);gap:20px}
  .hero-title{font-size:34px}
  .hero-sub{font-size:16px}
  .section-title{font-size:24px}
  .article,.research-card{padding:22px}
  .article h1,.detail-head h1{font-size:26px}
  .highlights{grid-template-columns:1fr}
  .score-bar{width:80px}
  .btn{padding:11px 20px;font-size:14px}
}
</style>
</head>

    xCircle:'<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',

function fmtTime(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return String(iso).replace('T',' ').slice(0,16);
  var p = function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

function freshnessText(kind){
  var meta = DATA_META[kind];
  if(!meta) return '内置兜底数据 · 等待自动抓取';
  return (meta.stale ? '数据截至 ' : '数据更新时间：') + fmtTime(meta.updatedAt) + (meta.stale ? '（沿用历史数据）' : '');
}

function freshnessHtml(kind){
  return '<span style="font-size:12px;color:var(--faint);font-weight:400;display:inline-flex;align-items:center;gap:4px">'+
    icon('calendar',13)+esc(freshnessText(kind))+'</span>';
}

  return false;
}

function fetchJson(url, bust){
  return fetch(bust ? url + '?t=' + Date.now() : url, { cache:'no-cache' }).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

function loadStaticData(bust){
  var jobs = [
    { kind:'news', url:'./data/news.json', apply: applyNewsData },
    { kind:'papers', url:'./data/papers.json', apply: applyPapersData },
    { kind:'leaderboards', url:'./data/leaderboards.json', apply: applyLeaderboardsData },
    { kind:'models', url:'./data/models.json', apply: applyModelsData }
  ];
  var ok = 0;
  return Promise.all(jobs.map(function(j){
    return fetchJson(j.url, bust).then(function(json){
      if(j.apply(json)) ok++;
    }).catch(function(){ /* 单文件失败不影响其它 */ });
  })).then(function(){
    if(ok > 0){ DATA_SOURCE = 'json'; route(); }
    return ok;
  });
}

function refreshData(){
  setStatus('正在加载最新数据…', true);
  loadStaticData(true).then(function(ok){
    if(ok > 0){
      setStatus('✓ 已更新 '+ok+' 个板块 · '+fmtTime(new Date().toISOString()));
      setTimeout(function(){ setStatus(''); }, 6000);
    } else {
      // 备选路径：浏览器端实时抓取（allorigins 代理）
      refreshAll();
    }
  });
}

function parseFeed(xml){
  var items = [];
  var reItem = /<item[\s>]([\s\S]*?)<\/item>/g, m;
  var reEntry = /<entry[\s>]([\s\S]*?)<\/entry>/g, e2;
  while((m=reItem.exec(xml))) items.push(m[1]);
  while((e2=reEntry.exec(xml))) items.push(e2[1]);
  return items;
}
function feedTag(block, tag){
  var re = new RegExp('<'+tag+'[^>]*>([\\s\\S]*?)</'+tag+'>','i');
  var m = block.match(re);
  return m ? m[1].replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g,'$1').replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#039;/g,"'").replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim() : '';
}
function feedLink(block){
  var a = block.match(/<link[^>]*href=["']([^"']+)["']/); if(a) return a[1];
  var l = block.match(/<link[^>]*>([\s\S]*?)<\/link>/i); return l ? l[1].trim() : '';
}
function feedDate(block){
  var d = feedTag(block,'pubDate') || feedTag(block,'published') || feedTag(block,'updated');
  if(!d) return '';
  var t = Date.parse(d);
  return isNaN(t) ? '' : new Date(t).toISOString().slice(0,10);
}
function classifyNews(title){
  var t = title.toLowerCase();
  if(/open[- ]?source|open weights|weights released|apache|mit license/.test(t)) return 'open-source';
  if(/release|launch|unveil|debut|introduce|announce|new model|gpt|claude|gemini|llama|deepseek|qwen|mistral|opus|sonnet/.test(t)) return 'model-release';
  if(/breakthrough|research|paper|benchmark|reasoning|math|science|discovery|achieves|solve|proof/.test(t)) return 'breakthrough';
  return 'industry';
}
function slugifyNews(title, i){
  var s = title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,50);
  return (s || 'news') + '-' + i;
}
function detectModel(title){
  var t = title.toLowerCase();
  var candidates = [
    {k:/gpt-?5\.5|gpt-?5\b|chatgpt/i, slug:'gpt-5-5', name:'GPT-5.5', company:'OpenAI'},
    {k:/gpt-?5\b/i, slug:'gpt-5', name:'GPT-5', company:'OpenAI'},
    {k:/claude.*opus|opus.*4\.7/i, slug:'claude-opus-4-7', name:'Claude Opus 4.7', company:'Anthropic'},
    {k:/claude.*sonnet|sonnet.*4\.6/i, slug:'claude-sonnet-4-6', name:'Claude Sonnet 4.6', company:'Anthropic'},
    {k:/gemini.*3.*deep|deep think/i, slug:'gemini-3-deep-think', name:'Gemini 3 Deep Think', company:'Google'},
    {k:/gemini.*3\b|gemini/i, slug:'gemini-3', name:'Gemini 3', company:'Google'},
    {k:/deepseek.*v4|deepseek/i, slug:'deepseek-v4', name:'DeepSeek V4', company:'DeepSeek'},
    {k:/qwen.*3.*max|qwen3/i, slug:'qwen3-max', name:'Qwen3-Max', company:'阿里云'},
    {k:/llama.*4.*maverick|maverick/i, slug:'llama-4-maverick', name:'Llama 4 Maverick', company:'Meta'},
    {k:/llama.*4.*scout|scout/i, slug:'llama-4-scout', name:'Llama 4 Scout', company:'Meta'}
  ];
  for(var i=0;i<candidates.length;i++){
    if(candidates[i].k.test(t)) return candidates[i];
  }
  return null;
}
function sourceName(url){
  if(url.indexOf('openai')>=0) return 'OpenAI';
  if(url.indexOf('techcrunch')>=0) return 'TechCrunch AI';
  if(url.indexOf('blog.google')>=0) return 'Google AI Blog';
  if(url.indexOf('theverge')>=0) return 'The Verge AI';
  if(url.indexOf('mit.edu')>=0) return 'MIT News AI';
  if(url.indexOf('arxiv')>=0) return 'arXiv';
  return 'AI Frontier';
}

function mergeNews(fresh){
  var map = {};
  fresh.forEach(function(n){
    var k = (n.title||'').toLowerCase().slice(0,50);
    if(!map[k]) map[k] = n;
  });
  var out = Object.keys(map).map(function(k){ return map[k]; });
  out.sort(function(a,b){ return (b.publishedAt||'').localeCompare(a.publishedAt||''); });
  return out.slice(0,18);
}
function mergePapers(fresh){
  var map = {};
  fresh.forEach(function(p){
    var k = (p.title||'').toLowerCase().slice(0,50);
    if(!map[k]) map[k] = p;
  });
  return Object.keys(map).map(function(k){ return map[k]; }).slice(0,12);
}

function setStatus(msg, spinning){
  var el = document.getElementById('newsStatus');
  if(!el) return;
  el.textContent = msg;
  el.style.opacity = msg ? 1 : 0;
  var btn = document.getElementById('refreshBtn');
  if(btn) btn.disabled = !!spinning;
}

function fetchFeed(url){
  return fetch(RSS_PROXY + encodeURIComponent(url))
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); });
}

/* —— 浏览器端实时抓取（备选路径，仅在 JSON 加载失败后的「刷新资讯」时触发） —— */
var NEWS_SOURCES = [
  'https://techcrunch.com/category/artificial-intelligence/feed/',
  'https://blog.google/technology/ai/rss/',
  'https://www.theverge.com/rss/ai-artificial-intelligence/index.xml',
  'https://news.mit.edu/rss/topic/artificial-intelligence2'
];
var MODEL_SOURCES = [
  'https://openai.com/blog/rss.xml',
  'https://www.theverge.com/rss/ai-artificial-intelligence/index.xml',
  'https://techcrunch.com/category/artificial-intelligence/feed/'
];
var RESEARCH_SOURCES = [
  'https://export.arxiv.org/rss/cs.AI',
  'https://news.mit.edu/rss/topic/artificial-intelligence2'
];

function refreshAll(){
  setStatus('正在实时抓取资讯…', true);
  var newsItems = [], researchItems = [], modelSignals = [];
  var totalTasks = NEWS_SOURCES.length + MODEL_SOURCES.length + RESEARCH_SOURCES.length;
  var done = 0, errors = 0;

  function finish(){
    if(done < totalTasks) return;
    // 更新新闻
    if(newsItems.length){
      NEWS.length = 0;
      Array.prototype.push.apply(NEWS, mergeNews(newsItems));
    }
    // 更新研究论文
    if(researchItems.length){
      PAPERS.length = 0;
      Array.prototype.push.apply(PAPERS, mergePapers(researchItems));
    }
    // 更新模型动态信号（附加为最新新闻条目）
    modelSignals.forEach(function(sig){
      NEWS.unshift(sig);
    });
    if(NEWS.length > 20) NEWS.length = 20;

    route();

    if(newsItems.length || researchItems.length || modelSignals.length){
      var n = newsItems.length + researchItems.length + modelSignals.length;
      setStatus('✓ 已更新 ' + n + ' 条 · ' + new Date().toLocaleTimeString('zh-CN'));
    } else if(errors){
      setStatus('抓取失败，显示预置内容（可能需联网）');
    }
    setTimeout(function(){ setStatus(''); }, 6000);
  }

  function parseInto(url, raw, target){
    parseFeed(raw).slice(0,5).forEach(function(item, i){
      var title = feedTag(item, 'title');
      if(!title) return;
      var summary = feedTag(item,'description') || feedTag(item,'summary') || feedTag(item,'content') || title;
      var link = feedLink(item);
      var date = feedDate(item);
      var src = sourceName(url);
      var entry = {
        id: target+'-'+Date.now()+'-'+i,
        slug: slugifyNews(title, i+1),
        title: title.slice(0,120),
        summary: summary.slice(0,240),
        category: target==='research' ? 'breakthrough' : classifyNews(title),
        publishedAt: date || new Date().toISOString().slice(0,10),
        source: src,
        sourceUrl: link,
        relatedModels: [],
        content: [['p', summary], ['p', '来源：'+src+'。']]
      };
      if(target==='news') newsItems.push(entry);
      else if(target==='research') researchItems.push({
        title: title.slice(0,120), authors: src, venue: date || '', link: link
      });
      else if(target==='model'){
        var m = detectModel(title);
        if(m){
          modelSignals.push(Object.assign({}, entry, {
            category: 'model-release',
            relatedModels: [m.slug],
            summary: (m.name + ' 相关动态：' + summary).slice(0,240)
          }));
        }
      }
    });
  }

  function runList(list, target){
    list.forEach(function(url){
      fetchFeed(url)
        .then(function(xml){ parseInto(url, xml, target); })
        .catch(function(){ errors++; })
        .finally(function(){ done++; finish(); });
    });
  }

  runList(NEWS_SOURCES, 'news');
  runList(MODEL_SOURCES, 'model');
  runList(RESEARCH_SOURCES, 'research');
}

function renderSearch(){
  var q = state.searchQuery.trim().toLowerCase();
  var results = {news:[],models:[],research:[]};
  var total = 0;
  if(q){
    results.news = NEWS.filter(function(n){return n.title.toLowerCase().indexOf(q)>=0 || n.summary.toLowerCase().indexOf(q)>=0;});
    results.models = MODELS.filter(function(m){return m.name.toLowerCase().indexOf(q)>=0 || m.company.toLowerCase().indexOf(q)>=0 || m.description.toLowerCase().indexOf(q)>=0 || m.features.some(function(f){return f.toLowerCase().indexOf(q)>=0;});});
    results.research = RESEARCH.filter(function(r){return r.title.toLowerCase().indexOf(q)>=0 || r.description.toLowerCase().indexOf(q)>=0 || r.category.toLowerCase().indexOf(q)>=0;});
    total = results.news.length + results.models.length + results.research.length;
  }

  var html = '<section class="section"><div class="container">'+
    '<div class="section-head" style="align-items:center"><div><h2 class="section-title">全站 <span class="t">搜索</span></h2><p class="section-desc">搜索新闻、模型和研究内容</p></div></div>'+
    '<div class="search-box"><span class="s-icon">'+icon('search',20)+'</span>'+
    '<input type="text" id="searchInput" placeholder="输入关键词搜索..." value="'+esc(state.searchQuery)+'" oninput="onSearchInput(this.value)">'+
    '<button class="s-clear'+(state.searchQuery?' show':'')+'" id="searchClear" onclick="clearSearch()">'+icon('xCircle',20)+'</button>'+
    '</div>';

  if(!q){
    html += '<div class="empty"><div>'+icon('search',56)+'</div><h3>输入关键词开始搜索</h3><p>支持搜索新闻标题、模型名称、研究主题等</p></div>';
  } else if(total===0){
    html += '<div class="empty"><div>'+icon('search',56)+'</div><h3>未找到相关结果</h3><p>尝试使用其他关键词，如「GPT」「Gemini」「开源」等</p></div>';
  } else {
    html += '<p style="color:var(--muted);font-size:14px;margin-bottom:8px">找到 '+total+' 个结果</p>';
    if(results.news.length){
      html += '<div class="result-group"><h3>新闻（'+results.news.length+'）</h3>'+results.news.map(function(n){
        return '<a href="#/news/'+n.slug+'" class="result-item"><div class="rt">'+esc(n.title)+'</div><div class="rs">'+esc(n.summary)+'</div><div class="rm">'+esc(n.source)+' · '+n.publishedAt+' · '+CATEGORY_LABEL[n.category]+'</div></a>';
      }).join('')+'</div>';
    }
    if(results.models.length){
      html += '<div class="result-group"><h3>模型（'+results.models.length+'）</h3>'+results.models.map(function(m){
        return '<a href="#/models/'+m.slug+'" class="result-item"><div class="rt">'+esc(m.name)+' <span style="color:var(--faint);font-weight:400;font-size:13px">'+esc(m.company)+'</span></div><div class="rs">'+esc(m.description)+'</div></a>';
      }).join('')+'</div>';
    }
    if(results.research.length){
      html += '<div class="result-group"><h3>研究（'+results.research.length+'）</h3>'+results.research.map(function(r){
        return '<a href="#/research" class="result-item"><div class="rt">'+esc(r.title)+' <span style="color:var(--purple);font-weight:600;font-size:12px">'+esc(r.category)+'</span></div><div class="rs">'+esc(r.description)+'</div></a>';
      }).join('')+'</div>';
    }
  }
  html += '</div></section>';
  return html;
}

/* ==================================================
   路由
================================================== */
function parseHash(){
  var h = location.hash.replace(/^#\/?/, '');
  var parts = h.split('/');
  if(!parts[0]) return {page:'home'};
  if(parts[0]==='news') return parts[1] ? {page:'newsDetail', slug:parts[1]} : {page:'news'};
  if(parts[0]==='models') return parts[1] ? {page:'modelDetail', slug:parts[1]} : {page:'models'};
  if(parts[0]==='leaderboards') return {page:'leaderboards'};
  if(parts[0]==='research') return {page:'research'};
  if(parts[0]==='search') return {page:'search'};
  return {page:'home'};
}

function route(){
  var r = parseHash();
  var app = document.getElementById('app');
  switch(r.page){
    case 'home': app.innerHTML = renderHome(); break;
    case 'news': app.innerHTML = renderNews(); break;
    case 'newsDetail': app.innerHTML = renderNewsDetail(r.slug); break;
    case 'models': app.innerHTML = renderModels(); break;
    case 'modelDetail': app.innerHTML = renderModelDetail(r.slug); break;
    case 'leaderboards': app.innerHTML = renderLeaderboards(); break;
    case 'research': app.innerHTML = renderResearch(); break;
    case 'search': app.innerHTML = renderSearch(); break;
    default: app.innerHTML = renderNotFound();
  }
  highlightNav(r.page);
  updateFooterFreshness();
  window.scrollTo(0,0);
  closeMenu();
}

function updateFooterFreshness(){
  var el = document.getElementById('footFresh');
  if(!el) return;
  var kinds = ['news','papers','leaderboards','models'];
  var times = kinds.map(function(k){ return DATA_META[k] && DATA_META[k].updatedAt; }).filter(Boolean);
  if(!times.length){ el.textContent = '· 数据更新时间：内置兜底数据'; return; }
  times.sort();
  el.textContent = '· 数据更新时间：' + fmtTime(times[times.length-1]);
}

function highlightNav(page){
  var map = {home:'home', news:'news', newsDetail:'news', models:'models', modelDetail:'models', leaderboards:'leaderboards', research:'research', search:''};
  var active = map[page] || '';
  var links = document.querySelectorAll('#nav a');
  for(var i=0;i<links.length;i++){
    var key = links[i].getAttribute('data-nav');
    if(key===active) links[i].classList.add('active'); else links[i].classList.remove('active');
  }
}

/* ==================================================
   交互处理
================================================== */
function setNewsCategory(c){ state.newsCategory=c; route(); }
function setModelCompany(c){ state.modelCompany=c; route(); }
function setLeaderboard(id){ state.leaderboardId=id; route(); }
function setResearchCategory(c){ state.researchCategory=c; route(); }
function onSearchInput(v){ state.searchQuery=v; route(); var el=document.getElementById('searchInput'); if(el){el.focus(); el.setSelectionRange(el.value.length, el.value.length);} }
function clearSearch(){ state.searchQuery=''; route(); }

function toggleMenu(){ document.getElementById('mobileMenu').classList.toggle('open'); }
function closeMenu(){ document.getElementById('mobileMenu').classList.remove('open'); }

/* ==================================================
   初始化
================================================== */
document.getElementById('menuBtn').addEventListener('click', function(e){ e.stopPropagation(); toggleMenu(); });
document.addEventListener('click', function(e){
  var menu = document.getElementById('mobileMenu');
  if(menu.classList.contains('open') && !e.target.closest('.header')) closeMenu();
});
window.addEventListener('hashchange', route);
route();
initData();
</script>
